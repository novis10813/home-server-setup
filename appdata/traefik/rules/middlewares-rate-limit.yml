http:
  middlewares:
    middlewares-rate-limit:
      rateLimit:
        average: 100
        burst: 50
    middlewares-rate-relaxed:
      rateLimit:
        average: 500
        burst: 200
    middlewares-rate-strict:
      rateLimit:
        average: 20
        burst: 10
    # SearXNG: each inbound request fans out to multiple upstream engines, so
    # the generic limit is too loose. 30 req/min sustained (burst 100 covers
    # a UI page load + autocomplete) stops runaway scripts per client IP.
    middlewares-rate-limit-searxng:
      rateLimit:
        average: 30
        period: 1m
        burst: 100