http:
  middlewares:
    chain-jellyseerr:
      chain:
        middlewares:
          - middlewares-rate-limit
          - middlewares-jellyseerr-headers

    # 與 middlewares-secure-headers 相同，但移除 X-Frame-Options: SAMEORIGIN，
    # 改由 jellyseerr.yml 的 CSP frame-ancestors 允許 Home Assistant iframe 嵌入
    middlewares-jellyseerr-headers:
      headers:
        accessControlAllowMethods:
          - GET
          - OPTIONS
          - PUT
        accessControlMaxAge: 100
        hostsProxyHeaders:
          - "X-Forwarded-Host"
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: false
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "same-origin"
        permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
        customResponseHeaders:
          X-Robots-Tag: "none,noindex,nofollow,noarchive,nosnippet,notranslate,noimageindex"
          server: ""
        customRequestHeaders:
          X-Forwarded-Proto: https
