# SearXNG cache proxy: Traefik -> nginx (cache) -> searxng
# Cuts upstream engine load (cached queries never reach SearXNG) and serves
# stale results when an upstream engine is down/blocked (proxy_cache_use_stale).
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # Search result cache (in-container RAM/disk, ephemeral; TTLs are short
    # by design so persisting across container recreates is not worth it)
    proxy_cache_path /var/cache/nginx/searx levels=1:2 keys_zone=searx_cache:64m max_size=256m inactive=24h;

    upstream searxng_backend {
        server searxng:8080;
    }

    server {
        listen 8080;

        # Sole client is Traefik (t3_proxy). Append, don't overwrite, so the
        # X-Forwarded-For chain Traefik started is preserved end to end.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        location / {
            proxy_pass http://searxng_backend;
            proxy_connect_timeout 10s;
            proxy_read_timeout 90s;
        }

        # Cache search results (nginx only caches GET/HEAD).
        # Key includes the search-affecting preference cookies so users with
        # different preferences never share cache entries.
        location /search {
            proxy_pass http://searxng_backend;
            proxy_connect_timeout 10s;
            proxy_read_timeout 90s;

            proxy_cache searx_cache;
            proxy_cache_key "$request_method$request_uri$cookie_categories$cookie_language$cookie_locale$cookie_safesearch$cookie_disabled_engines$cookie_enabled_engines";
            proxy_cache_valid 200 60s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        # Autocomplete suggestions are stable for a long time
        location /autocompleter {
            proxy_pass http://searxng_backend;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;

            proxy_cache searx_cache;
            proxy_cache_key "$request_method$request_uri$cookie_autocomplete";
            proxy_cache_valid 200 300s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status always;
        }
    }
}
