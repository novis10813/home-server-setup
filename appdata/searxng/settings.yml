# SearXNG settings
# https://docs.searxng.org/admin/settings/index.html

use_default_settings: true

general:
  debug: false
  instance_name: "SearXNG"
  privacypolicy_url: false
  contact_url: false
  enable_metrics: false

server:
  secret_key: "968181754cd27d739553733b9241037415fc150fdd069c01d2b8a09c66e31157"
  limiter: false  # disable rate limiting for internal AI agent use
  image_proxy: false
  base_url: false
  port: 8080
  bind_address: "0.0.0.0"

ui:
  static_use_hash: true
  default_locale: "zh-Hant-TW"
  default_theme: simple
  results_on_new_tab: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "zh-TW"
  formats:
    - html
    - json  # required for AI agent API access

# Redis not needed for single-instance without limiter
redis:
  url: false

outgoing:
  useragent_suffix: "novis10813-SearXNGBot/1.0 (mailto:zhizhongz895253@gmail.com)"

engines:
  - name: wikidata
    disabled: true
  # 2026-09: these engines blocked this server's public IP (CAPTCHA/429/403
  # in container logs, worst: duckduckgo). Disabled so searches stop hitting
  # guaranteed-blocked upstreams; re-enable once the IP cools down.
  - name: duckduckgo
    disabled: true
  - name: startpage
    disabled: true
  - name: karmasearch
    disabled: true
  # Also 403s every request from this IP (tested 2026-09-14)
  - name: mojeek
    disabled: true
  # Second general web engine (disabled by default upstream, works from this
  # IP as of 2026-09-14; handles zh-TW queries fine)
  - name: bing
    disabled: false
