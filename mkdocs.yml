# MkDocs - Home Server Docker 設定文件
# 本地預覽: mkdocs serve
# 建置靜態站: mkdocs build

site_name: Home Server Docker 文件
site_description: Home Server Docker 服務設定與操作說明
site_url: null  # 若部署到固定網址可填

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切換深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切換淺色模式
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - content.code.copy

plugins:
  - search

nav:
  - 首頁: README.md
  - Infrastructure:
    - 概述: infrastructure/README.md
    - 架構與目錄: infrastructure/architecture.md
    - 網路圖: infrastructure/network-diagram.md
    - 設定與環境: infrastructure/configuration.md
    - 服務說明: infrastructure/services.md
    - Traefik 規則: infrastructure/traefik-rules.md
    - 操作與維護: infrastructure/operations.md
  - App:
    - 概述: app/README.md
    - CLIProxyAPI: app/cliproxyapi.md
    - code-server: app/code-server.md
    - Hugo: app/hugo.md
    - HugObsidian: app/hugobsidian.md
    - Home Assistant: app/home-assistant.md
    - Minecraft: app/minecraft.md
    - SearXNG: app/searxng.md
    - WebDAV: app/webdav.md
  - Media:
    - 概述: media/README.md
  - Home stack:
    - 概述: homestack/README.md
    - NATS: homestack/nats.md
    - MinIO: homestack/minio.md
    - Redis: homestack/redis.md
    - Nautilus catalog builder: homestack/nautilus-catalog-builder.md
    - Pi Agent Task Manager (PAT): homestack/pat.md
  - 設計文件:
    - Jellyseerr 設計: plans/2026-02-10-jellyseerr-design.md
    - CWA 遷移計畫: superpowers/plans/2026-04-18-cwa-migration.md
    - CWA 遷移 spec: superpowers/specs/2026-04-18-cwa-migration-design.md
    - CLIProxyAPI 安裝: superpowers/plans/2026-07-28-cliproxyapi-installation.md
    - CLIProxyAPI API-key only: superpowers/plans/2026-08-02-cliproxyapi-api-key-only.md
    - CLIProxyAPI management UI: superpowers/plans/2026-08-02-cliproxyapi-management-ui.md

markdown_extensions:
  - pymdownx.superfences
  - tables
