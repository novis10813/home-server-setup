# Hermes Agent - persistent self-hosted AI agent
# https://github.com/NousResearch/hermes-agent

services:
  ###########################################################################
  # Hermes Agent
  ###########################################################################
  hermes:
    container_name: hermes
    image: nousresearch/hermes-agent:${HERMES_VERSION:-latest}
    restart: unless-stopped
    command: gateway run
    post_start:
      # Configure the containerized listener and restart an existing proxy setup.
      - command: /bin/sh /usr/local/bin/hermes-post-start
    security_opt:
      - no-new-privileges:true
    networks:
      t3_proxy: {}
      ai_services: {}
      ai_control: {}
    volumes:
      - ${DATADIR}/hermes:/opt/data
      # Keep the sandbox root identical inside Hermes and on the host daemon.
      - ${DATADIR}/hermes:${DATADIR}/hermes
      - ${DOCKERDIR}/compose/scripts/hermes-post-start.sh:/usr/local/bin/hermes-post-start:ro
      - /etc/localtime:/etc/localtime:ro
    # Bind only on host docker0 so default-bridge sandboxes can reach iron-proxy.
    ports:
      - "${HERMES_EGRESS_BIND_IP:-172.17.0.1}:9090:9090"
      - "${HERMES_EGRESS_BIND_IP:-172.17.0.1}:9091:9091"
    environment:
      - TZ=${TZ}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # Host Docker must resolve every sandbox bind source to the same path.
      - HERMES_HOME=${DATADIR}/hermes
      - HERMES_WRITE_SAFE_ROOT=${DATADIR}/hermes
      - DOCKER_HOST=tcp://hermes-socket-proxy:2375
      - TERMINAL_SANDBOX_DIR=${DATADIR}/hermes
      - SEARXNG_URL=http://searxng:8080
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=9119
    deploy:
      resources:
        limits:
          memory: ${HERMES_MEMORY_LIMIT:-4g}
          cpus: "${HERMES_CPU_LIMIT:-2.0}"
    labels:
      - "traefik.enable=true"
      ## OpenAI-compatible API (API_SERVER_KEY required)
      - "traefik.http.routers.hermes-api-rtr.entrypoints=websecure-internal"
      - "traefik.http.routers.hermes-api-rtr.rule=Host(`hermes-api.${DOMAINNAME_1}`)"
      - "traefik.http.routers.hermes-api-rtr.middlewares=chain-no-auth@file"
      - "traefik.http.routers.hermes-api-rtr.service=hermes-api-svc"
      - "traefik.http.services.hermes-api-svc.loadbalancer.server.port=8642"
      ## Dashboard (Hermes authentication plus Traefik OAuth)
      - "traefik.http.routers.hermes-dashboard-rtr.entrypoints=websecure-internal"
      - "traefik.http.routers.hermes-dashboard-rtr.rule=Host(`hermes.${DOMAINNAME_1}`)"
      - "traefik.http.routers.hermes-dashboard-rtr.middlewares=chain-oauth@file"
      - "traefik.http.routers.hermes-dashboard-rtr.service=hermes-dashboard-svc"
      - "traefik.http.services.hermes-dashboard-svc.loadbalancer.server.port=9119"
