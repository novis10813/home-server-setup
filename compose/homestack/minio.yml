# MinIO — Homestack S3-compatible object storage
# 部署：從 /opt/docker/ 執行，勿直接 -f 本檔（DOCKERDIR 不會被載入）
#   docker compose -f docker-compose-homestack.yml up -d minio minio-init

services:
  minio:
    container_name: minio
    image: minio/minio:${MINIO_VERSION:-latest}
    command: server /data --console-address ":9001"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - homestack
      - t3_proxy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DATADIR}/minio:/data
    env_file:
      - ${DOCKERDIR}/secrets/minio.env
    environment:
      - TZ=${TZ:-UTC}
      - MINIO_SERVER_URL=https://s3.${DOMAINNAME_1}
      - MINIO_BROWSER_REDIRECT_URL=https://minio.${DOMAINNAME_1}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=t3_proxy"
      - "traefik.http.routers.minio-s3-rtr.entrypoints=websecure-internal"
      - "traefik.http.routers.minio-s3-rtr.rule=Host(`s3.${DOMAINNAME_1}`)"
      - "traefik.http.routers.minio-s3-rtr.middlewares=chain-no-auth-relaxed@file"
      - "traefik.http.routers.minio-s3-rtr.service=minio-s3-svc"
      - "traefik.http.services.minio-s3-svc.loadbalancer.server.port=9000"
      - "traefik.http.routers.minio-console-rtr.entrypoints=websecure-internal"
      - "traefik.http.routers.minio-console-rtr.rule=Host(`minio.${DOMAINNAME_1}`)"
      - "traefik.http.routers.minio-console-rtr.middlewares=chain-oauth@file"
      - "traefik.http.routers.minio-console-rtr.service=minio-console-svc"
      - "traefik.http.services.minio-console-svc.loadbalancer.server.port=9001"
    deploy:
      resources:
        limits:
          memory: ${MINIO_MEMORY_LIMIT:-1g}
          cpus: "${MINIO_CPU_LIMIT:-1.0}"

  minio-init:
    container_name: minio-init
    image: minio/mc:${MINIO_MC_VERSION:-latest}
    restart: "no"
    security_opt:
      - no-new-privileges:true
    networks:
      - homestack
    env_file:
      - ${DOCKERDIR}/secrets/minio.env
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          sleep 2
        done
        mc mb -p local/market-data || true
        mc mb -p local/nautilus-data || true
        cat > /tmp/homestack-s3-policy.json <<'EOF'
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": [
                "s3:GetBucketLocation",
                "s3:ListBucket",
                "s3:ListBucketMultipartUploads"
              ],
              "Resource": [
                "arn:aws:s3:::market-data",
                "arn:aws:s3:::nautilus-data"
              ]
            },
            {
              "Effect": "Allow",
              "Action": [
                "s3:AbortMultipartUpload",
                "s3:DeleteObject",
                "s3:GetObject",
                "s3:ListMultipartUploadParts",
                "s3:PutObject"
              ],
              "Resource": [
                "arn:aws:s3:::market-data/*",
                "arn:aws:s3:::nautilus-data/*"
              ]
            }
          ]
        }
        EOF
        mc admin policy create local homestack-s3 /tmp/homestack-s3-policy.json || mc admin policy info local homestack-s3 >/dev/null
        mc admin user add local "$${MINIO_APP_ACCESS_KEY}" "$${MINIO_APP_SECRET_KEY}" || true
        mc admin policy attach local homestack-s3 --user "$${MINIO_APP_ACCESS_KEY}"

networks:
  t3_proxy:
    external: true
  homestack:
    external: true
