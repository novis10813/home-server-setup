# restic-backup — Immich 照片與資料庫、各服務設定備份到 Google Drive（加密、快照）
# 由 cron 容器透過 socket-proxy 觸發（見 appdata/cron/crontab），執行完即結束
# 建立容器（不會執行備份）：
#   docker compose -f docker-compose-infrastructure.yml --profile backup build restic-backup
#   docker compose -f docker-compose-infrastructure.yml --profile backup create restic-backup
# 手動執行：docker start -a restic-backup

services:
  restic-backup:
    container_name: restic-backup
    build:
      context: ${DOCKERDIR}/appdata/restic-backup
    image: local/restic-backup:0.18.0
    profiles:
      - backup
    restart: "no"
    hostname: restic-backup # 固定主機名稱，避免每次重建容器後 restic 找不到上一份快照
    security_opt:
      - no-new-privileges:true
    networks:
      - homestack # 讀取 MinIO market-data（唯讀帳號）
    env_file:
      - ${DOCKERDIR}/secrets/market-data-backup.env
    secrets:
      - restic_password
    environment:
      - TZ=${TZ:-UTC}
      - RESTIC_REPOSITORY=rclone:gdrive:restic/immich
      - RESTIC_PASSWORD_FILE=/run/secrets/restic_password
      - RCLONE_CONFIG=/config/rclone/rclone.conf
      # MinIO remote（金鑰在 backup.sh 內從 env_file 變數帶入）
      - RCLONE_CONFIG_MINIO_TYPE=s3
      - RCLONE_CONFIG_MINIO_PROVIDER=Minio
      - RCLONE_CONFIG_MINIO_ENDPOINT=http://minio:9000
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DATADIR}/immich/library:/source/library:ro
      # 設定備份來源（唯讀；實際備份的路徑與排除規則見 backup.sh）
      - ${DOCKERDIR}:/source/docker:ro
      - ${DATADIR}/homeassistant:/source/data/homeassistant:ro
      - ${DATADIR}/pihole:/source/data/pihole:ro
      - ${DATADIR}/grafana:/source/data/grafana:ro
      - ${DATADIR}/sonarr:/source/data/sonarr:ro
      - ${DATADIR}/radarr:/source/data/radarr:ro
      - ${DATADIR}/prowlarr:/source/data/prowlarr:ro
      - ${DATADIR}/jellyseerr:/source/data/jellyseerr:ro
      - ${DOCKERDIR}/appdata/restic-backup/backup.sh:/backup.sh:ro
      # rclone 會回寫更新後的 token，需用目錄掛載（單檔掛載無法原子取代）
      - ${DOCKERDIR}/secrets/rclone:/config/rclone
      # 快取資料夾不存在時由 Docker 自動建立
      - ${DATADIR}/restic-backup/cache:/root/.cache/restic
      # market-data 暫存區：rclone 從 MinIO 增量複製到此（約 33 GB，只增不刪），再由 restic 打包上傳
      - ${DATADIR}/restic-backup/market-data-staging:/staging
      # Prometheus textfile collector 指標輸出（供 node-exporter 讀取）
      - ${DATADIR}/restic-backup/metrics:/metrics
    command: ["/bin/sh", "/backup.sh"]
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

networks:
  homestack:
    external: true
