# Dedicated Docker API proxy for Hermes; do not reuse infrastructure socket-proxy.

services:
  hermes-socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: hermes-socket-proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      ai_control: {}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /run
    environment:
      - LOG_LEVEL=warning
      # Explicitly enabled Hermes backend gates.
      - PING=1
      - VERSION=1
      - INFO=1
      - IMAGES=1
      - CONTAINERS=1
      - POST=1
      - EXEC=1
      - ALLOW_START=1
      - ALLOW_STOP=1
      # Explicitly disabled gates not required by Hermes.
      - AUTH=0
      - SECRETS=0
      - ALLOW_RESTARTS=0
      - EVENTS=0
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - DISTRIBUTION=0
      - NETWORKS=0
      - NODES=0
      - PLUGINS=0
      - SERVICES=0
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=0
      - VOLUMES=0
      - DISABLE_IPV6=0

