# code-server - Browser-based VS Code for this Docker config repo
# https://docs.linuxserver.io/images/docker-code-server/

services:
  ###########################################################################
  # code-server
  ###########################################################################
  code-server:
    container_name: code-server
    image: lscr.io/linuxserver/code-server:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - t3_proxy
    volumes:
      - ${DATADIR}/code-server/config:/config
      - ${DOCKERDIR}:/config/workspace/docker
      - /mnt/raid1:/config/workspace/raid1
      - /home/novis:/config/workspace/home
      - /etc/localtime:/etc/localtime:ro
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ}
      - DEFAULT_WORKSPACE=/config/workspace/docker
      - PROXY_DOMAIN=code.${DOMAINNAME_1}
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    labels:
      - "traefik.enable=true"
      ## HTTPS Router (internal only)
      - "traefik.http.routers.code-server-rtr.entrypoints=websecure-internal"
      - "traefik.http.routers.code-server-rtr.rule=Host(`code.${DOMAINNAME_1}`)"
      - "traefik.http.routers.code-server-rtr.middlewares=chain-oauth@file"
      ## Service
      - "traefik.http.routers.code-server-rtr.service=code-server-svc"
      - "traefik.http.services.code-server-svc.loadbalancer.server.port=8443"

networks:
  t3_proxy:
    external: true
