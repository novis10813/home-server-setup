# SearXNG - Privacy-respecting metasearch engine
# https://docs.searxng.org/admin/installation-docker.html

services:
  ###########################################################################
  # SearXNG
  ###########################################################################
  searxng:
    container_name: searxng
    image: searxng/searxng:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${DOCKERDIR}/appdata/searxng:/etc/searxng:rw
      - ${DOCKERDIR}/appdata/searxng/wikidata.py:/usr/local/searxng/searx/engines/wikidata.py:ro
      - ${DOCKERDIR}/appdata/searxng/engines_cache:/usr/local/searxng/searx/engines/__pycache__:rw
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ}
      - SEARXNG_BASE_URL=https://search.${DOMAINNAME_1}/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    networks:
      t3_proxy: {}

  ###########################################################################
  # SearXNG cache proxy (nginx) — Traefik routes here, not to searxng
  #
  # Caches /search (60s) and /autocompleter (300s) in-container to cut
  # upstream engine load, and serves stale entries when an upstream engine
  # errors (proxy_cache_use_stale). Cache is ephemeral by design (short TTL),
  # no runtime data is persisted.
  ###########################################################################
  searxng-nginx:
    container_name: searxng-nginx
    image: nginx:alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${DOCKERDIR}/appdata/searxng/nginx.conf:/etc/nginx/nginx.conf:ro
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    networks:
      t3_proxy: {}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.searxng-rtr.entrypoints=websecure-internal"
      - "traefik.http.routers.searxng-rtr.rule=Host(`search.${DOMAINNAME_1}`)"
      - "traefik.http.routers.searxng-rtr.middlewares=middlewares-rate-limit-searxng@file,chain-no-auth@file"
      - "traefik.http.services.searxng-svc.loadbalancer.server.port=8080"
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
